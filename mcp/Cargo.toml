[package]
name = "cornflake-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing Cornflake meetings to Claude and other MCP clients"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "chrono"] }
tokio = { version = "1.32.0", features = ["full"] }
dirs = "5.0.1"
